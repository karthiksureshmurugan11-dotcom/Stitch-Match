<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StitchMatch - Where Garment Skills Meet Opportunity</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4A90E2',
                        secondary: '#8B7355'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <style>
        :where([class^="ri-"])::before {
            content: "\f3c2";
        }
        body {
            font-family: 'Poppins', sans-serif;
        }
        .hero-bg {
            background-image: url('https://readdy.ai/api/search-image?query=Modern%20garment%20workshop%20with%20sewing%20machines%20and%20fabric%20rolls%20in%20soft%20natural%20lighting%2C%20beige%20and%20blue%20color%20palette%2C%20professional%20textile%20manufacturing%20environment%20with%20skilled%20workers%20crafting%20quality%20garments%2C%20clean%20minimalist%20background%20with%20fabric%20textures&width=1920&height=1080&seq=hero1&orientation=landscape');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .fabric-texture {
            background-image: url('https://readdy.ai/api/search-image?query=Subtle%20beige%20fabric%20texture%20with%20delicate%20thread%20patterns%2C%20soft%20cotton%20weave%20background%2C%20minimal%20and%20clean%20textile%20surface%20for%20web%20design&width=800&height=600&seq=texture1&orientation=landscape');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-stone-50 text-gray-900">
    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 flex items-center justify-center">
                    </div>
                     <img src="Images/Logo-removebg-preview.png"
                            alt="Logo" class="h-8 mr-3">
                    <h1 class="font-[''] text-3xl text-primary">StitchMatch</h1>
                </div>
                
                <div class="hidden md:flex items-center space-x-8">
                    <a href="Index.html" class="text-primary font-medium transition-colors">Home</a>
                    <a href="CreateProfile.html" class="text-gray-700 hover:text-primary transition-colors">Find Work</a>
                    <a href="#" class="text-gray-700 hover:text-primary transition-colors">Hire Talent</a>
                    <a href="#" class="text-gray-700 hover:text-primary transition-colors">Features</a>
                </div>
                
                <div class="flex items-center space-x-3">
                    <a href="Signin.html"><button class="bg-primary text-white px-6 py-2 !rounded-button hover:bg-blue-600 transition-colors whitespace-nowrap">Sign In</button></a>
                    <a href="CreateProfile.html"><button class="bg-primary text-white px-6 py-2 !rounded-button hover:bg-blue-600 transition-colors whitespace-nowrap">Get Started</button></a>
                </div>
                
                <div class="md:hidden">
                    <div class="w-6 h-6 flex items-center justify-center">
                        <i class="ri-menu-line text-xl"></i>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <body class="bg-gray-50 min-h-screen">
    <div class="min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8"
        style="background-image: url('https://readdy.ai/api/search-image?query=soft%20gradient%20background%20with%20subtle%20solar%20panel%20texture%20and%20warm%20sunlight%20rays%20creating%20peaceful%20atmosphere%2C%20clean%20minimalist%20design%20with%20light%20blue%20and%20white%20colors%2C%20perfect%20for%20login%20page%20backdrop%20with%20gentle%20warmth%20feeling&width=1920&height=1080&seq=loginbg1&orientation=landscape'); background-size: cover; background-position: center;">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center mb-8">
                
            </div>
        </div>
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow-xl rounded-xl sm:px-10 border border-gray-100">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-900 text-center mb-2">Welcome Back</h2>
                    <p class="text-gray-600 text-center text-sm">Sign in to your StitchMatch account</p>
                </div>
                <form class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email Address</label>
                        <div class="relative">
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="w-full px-4 py-3 border border-gray-300 rounded-button focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm"
                                placeholder="Enter your email address">
                            <div
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 w-5 h-5 flex items-center justify-center">
                                <i class="ri-mail-line text-gray-400 text-sm"></i>
                            </div>
                        </div>
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                required
                                class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-button focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent text-sm"
                                placeholder="Enter your password">
                            <button type="button"
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 w-5 h-5 flex items-center justify-center text-gray-400 hover:text-gray-600">
                                <i class="ri-eye-line text-sm toggle-password"></i>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="sr-only">
                            <div
                                class="w-4 h-4 border-2 border-gray-300 rounded-sm flex items-center justify-center cursor-pointer remember-checkbox">
                                <i class="ri-check-line text-white text-xs hidden check-icon"></i>
                            </div>
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700 cursor-pointer">Remember
                                me</label>
                        </div>
                        <a href="#" class="text-sm text-primary hover:text-blue-600 transition-colors">Forgot
                            password?</a>
                    </div>
                    <div>
                        <a href="Index.html"><button type="submit"
                            class="w-full bg-primary text-white py-3 px-4 rounded-button font-medium hover:bg-blue-600 transition-colors whitespace-nowrap">Sign
                            In</button></a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">or continue with</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button"
                            class="w-full inline-flex justify-center items-center py-3 px-4 border border-gray-300 rounded-button bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                            <div class="w-5 h-5 flex items-center justify-center mr-2">
                                <i class="ri-google-fill text-red-500"></i>
                            </div>
                            Google
                        </button>
                        <button type="button"
                            class="w-full inline-flex justify-center items-center py-3 px-4 border border-gray-300 rounded-button bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
                            <div class="w-5 h-5 flex items-center justify-center mr-2">
                                <i class="ri-apple-fill text-gray-900"></i>
                            </div>
                            Apple
                        </button>
                    </div>
                </form>
                <div class="mt-6 text-center">
                    <p class="text-sm text-gray-600">
                        Don't have an account?
                        <a href="Signin.html"
                            data-readdy="true"
                            class="text-primary hover:text-blue-600 font-medium transition-colors">Sign up for free</a>
                    </p>
                </div>
            </div>
        </div>
        <div class="mt-8 text-center">
            <div class="flex justify-center space-x-6 text-sm text-gray-500">
                <a href="#" class="hover:text-gray-700 transition-colors">Privacy Policy</a>
                <a href="#" class="hover:text-gray-700 transition-colors">Terms of Service</a>
                <a href="#" class="hover:text-gray-700 transition-colors">Help Center</a>
            </div>
            <p class="mt-4 text-xs text-gray-400">&copy; 2025 SunNest. All rights reserved.</p>
        </div>
    </div>
    <script id="password-toggle-functionality">
        document.addEventListener('DOMContentLoaded', function () {
            const passwordInput = document.getElementById('password');
            const toggleButton = document.querySelector('.toggle-password');
            const toggleIcon = toggleButton;
            toggleButton.addEventListener('click', function () {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleIcon.classList.remove('ri-eye-line');
                    toggleIcon.classList.add('ri-eye-off-line');
                } else {
                    passwordInput.type = 'password';
                    toggleIcon.classList.remove('ri-eye-off-line');
                    toggleIcon.classList.add('ri-eye-line');
                }
            });
        });
    </script>
    <script id="checkbox-functionality">
        document.addEventListener('DOMContentLoaded', function () {
            const checkbox = document.getElementById('remember-me');
            const checkboxVisual = document.querySelector('.remember-checkbox');
            const checkIcon = document.querySelector('.check-icon');
            checkboxVisual.addEventListener('click', function () {
                checkbox.checked = !checkbox.checked;
                if (checkbox.checked) {
                    checkboxVisual.classList.remove('border-gray-300');
                    checkboxVisual.classList.add('border-primary', 'bg-primary');
                    checkIcon.classList.remove('hidden');
                } else {
                    checkboxVisual.classList.remove('border-primary', 'bg-primary');
                    checkboxVisual.classList.add('border-gray-300');
                    checkIcon.classList.add('hidden');
                }
            });
        });
    </script>
    <script id="form-validation">
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.querySelector('form');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                let isValid = true;
                if (!emailInput.value || !emailInput.value.includes('@')) {
                    emailInput.classList.add('border-red-500', 'focus:ring-red-500');
                    emailInput.classList.remove('border-gray-300', 'focus:ring-primary');
                    isValid = false;
                } else {
                    emailInput.classList.remove('border-red-500', 'focus:ring-red-500');
                    emailInput.classList.add('border-gray-300', 'focus:ring-primary');
                }
                if (!passwordInput.value || passwordInput.value.length < 6) {
                    passwordInput.classList.add('border-red-500', 'focus:ring-red-500');
                    passwordInput.classList.remove('border-gray-300', 'focus:ring-primary');
                    isValid = false;
                } else {
                    passwordInput.classList.remove('border-red-500', 'focus:ring-red-500');
                    passwordInput.classList.add('border-gray-300', 'focus:ring-primary');
                }
                if (isValid) {
                    const submitButton = form.querySelector('button[type="submit"]');
                    submitButton.textContent = 'Signing In...';
                    submitButton.disabled = true;
                    setTimeout(() => {
                        submitButton.textContent = 'Sign In';
                        submitButton.disabled = false;
                    }, 2000);
                }
            });
        });
    </script>
</body>

</html>
